# nginx site config for the Stern Home Leaderboard (reverse proxy -> :8888).
# Deploy to /etc/nginx/sites-available/leaderboards (symlinked into sites-enabled).
#
# Fixes for the Vaadin server-push instability that caused lost NEW_SCORE
# celebrations (dropped confetti/trophy):
#   1. `Connection: upgrade` is now sent ONLY for real WebSocket handshakes,
#      via the $connection_upgrade map. Previously it was hardcoded on every
#      request, mangling non-WebSocket push traffic ("request object has been
#      recycled" / Servlet30CometSupport errors).
#   2. proxy_read_timeout / proxy_send_timeout raised well above nginx's 60s
#      default so an idle push WebSocket is not culled during quiet periods.

# Must live in the http context; a sites-* file is included there, so keeping
# the map at the top of this file (outside server{}) is valid.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;

    server_name _;

    ssl_certificate /etc/letsencrypt/live/mauerkinder.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mauerkinder.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required by Vaadin push)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep long-lived push connections alive through quiet periods.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
